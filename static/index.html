<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walter</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0f1117; color: #e2e8f0;
  min-height: 100dvh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 32px; padding: 32px;
}
header { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.logo { font-size: 2rem; font-weight: 800; color: #3b82f6; letter-spacing: -.04em; }
.ros-status {
  display: flex; align-items: center; gap: 7px;
  font-size: 0.75rem; font-family: monospace; color: #475569;
}
.ros-dot { width: 8px; height: 8px; border-radius: 50%; background: #334155; transition: background .3s; }
.ros-dot.ok  { background: #22c55e; }
.ros-dot.err { background: #ef4444; }
.grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 16px; width: 100%; max-width: 620px;
}
.card {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px; padding: 32px 16px;
  background: #13151f; border: 1px solid #1a1d2e;
  border-radius: 14px; cursor: pointer;
  text-decoration: none; color: inherit;
  transition: background .15s, border-color .15s, transform .1s;
}
.card:hover { background: #1a1d2e; border-color: #253050; transform: translateY(-2px); }
.card svg { width: 40px; height: 40px; color: #334155; transition: color .15s; }
.card:hover svg { color: #60a5fa; }
.card-title { font-size: 0.95rem; font-weight: 700; }
.card-desc  { font-size: 0.72rem; color: #334155; text-align: center; line-height: 1.5; }
@media (max-width: 640px) {
  body { padding: 20px 16px; gap: 24px; }
  .grid { grid-template-columns: repeat(2, 1fr); max-width: 100%; gap: 12px; }
  .card { padding: 24px 12px; gap: 8px; }
  .card svg { width: 32px; height: 32px; }
  .card-title { font-size: .88rem; }
  .card-desc  { font-size: .65rem; }
}
</style>
</head>
<body>

<header>
  <div class="logo">Walter</div>
  <div class="ros-status">
    <div class="ros-dot" id="ros-dot"></div>
    <span id="ros-label">Connecting…</span>
  </div>
</header>

<div class="grid">

  <a class="card" href="/static/map.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="12" r="3"/>
      <circle cx="12" cy="12" r="7" stroke-dasharray="2 2"/>
      <circle cx="12" cy="12" r="11"/>
    </svg>
    <div class="card-title">Map</div>
    <div class="card-desc">Build the map while driving manually</div>
  </a>

  <a class="card" href="/static/editor.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
    </svg>
    <div class="card-title">Editor</div>
    <div class="card-desc">Place tables, zones and origin on the map</div>
  </a>

  <a class="card" href="/static/delivery.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M5 12h14M12 5l7 7-7 7"/>
    </svg>
    <div class="card-title">Delivery</div>
    <div class="card-desc">Send Walter to a table autonomously</div>
  </a>

  <a class="card" href="/static/drive.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <line x1="12" y1="2"  x2="12" y2="8"/>
      <line x1="12" y1="16" x2="12" y2="22"/>
      <line x1="2"  y1="12" x2="8"  y2="12"/>
      <line x1="16" y1="12" x2="22" y2="12"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
    <div class="card-title">Drive</div>
    <div class="card-desc">Manual keyboard / d-pad controller</div>
  </a>

  <a class="card" href="/static/face.html" target="_blank">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="12" r="10"/>
      <circle cx="9"  cy="10" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="15" cy="10" r="1.5" fill="currentColor" stroke="none"/>
      <path d="M8 15s1.5 2 4 2 4-2 4-2"/>
    </svg>
    <div class="card-title">Face</div>
    <div class="card-desc">Robot face screen (opens in new tab)</div>
  </a>

  <a class="card" href="/static/logs.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
    </svg>
    <div class="card-title">Logs</div>
    <div class="card-desc">Live sensor data — LiDAR, odom, IMU, cmd_vel</div>
  </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
<script>
const ros = new ROSLIB.Ros({ url: `ws://${location.hostname}:9090` });
ros.on('connection', () => {
  document.getElementById('ros-dot').className = 'ros-dot ok';
  document.getElementById('ros-label').textContent = 'ROS Connected';
});
ros.on('close', () => {
  document.getElementById('ros-dot').className = 'ros-dot';
  document.getElementById('ros-label').textContent = 'Disconnected';
});
ros.on('error', () => {
  document.getElementById('ros-dot').className = 'ros-dot err';
  document.getElementById('ros-label').textContent = 'ROS Error';
});
</script>
</body>
</html>
