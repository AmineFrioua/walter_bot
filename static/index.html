<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walter — Delivery</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: #1a1d27;
    border-bottom: 1px solid #2d3148;
  }

  header h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: 0.05em; }

  #status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #ef4444; transition: background 0.4s;
  }
  #status-dot.connected { background: #22c55e; }

  #status-label { font-size: 0.8rem; color: #94a3b8; margin-left: 8px; }

  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 0;
    min-height: 0;
  }

  /* ── Map ── */
  #map-wrap {
    position: relative;
    background: #1a1d27;
    overflow: hidden;
  }

  canvas#map-canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  #robot-marker {
    position: absolute;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #3b82f6;
    border: 3px solid #fff;
    transform: translate(-50%, -50%);
    transition: left 0.4s, top 0.4s;
    pointer-events: none;
    display: none;
  }

  /* Direction arrow on robot */
  #robot-marker::after {
    content: '';
    position: absolute;
    top: -8px; left: 50%;
    transform: translateX(-50%);
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-bottom: 8px solid #fff;
  }

  .table-dot {
    position: absolute;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #f59e0b;
    border: 2px solid #fff;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .table-dot.target {
    background: #22c55e;
    box-shadow: 0 0 0 4px rgba(34,197,94,0.35);
  }

  /* ── Sidebar ── */
  #sidebar {
    display: flex;
    flex-direction: column;
    background: #1a1d27;
    border-left: 1px solid #2d3148;
    padding: 16px;
    gap: 12px;
    overflow-y: auto;
  }

  #sidebar h2 { font-size: 0.85rem; text-transform: uppercase;
    letter-spacing: 0.08em; color: #64748b; margin-bottom: 4px; }

  .table-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-radius: 10px;
    background: #252836;
    border: 2px solid transparent;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    color: #e2e8f0;
    transition: background 0.15s, border-color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .table-btn:hover { background: #2d3148; }
  .table-btn.selected { border-color: #3b82f6; background: #1e3a5f; }
  .table-btn.delivering { border-color: #22c55e; background: #14532d; }

  .table-btn .icon { font-size: 1.3rem; }

  #send-btn {
    margin-top: auto;
    padding: 16px;
    border-radius: 12px;
    border: none;
    background: #3b82f6;
    color: #fff;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }

  #send-btn:disabled { opacity: 0.4; cursor: default; }
  #send-btn:not(:disabled):hover { background: #2563eb; }
  #send-btn.cancel { background: #ef4444; }
  #send-btn.cancel:not(:disabled):hover { background: #dc2626; }

  #robot-state {
    text-align: center;
    font-size: 0.85rem;
    color: #94a3b8;
    min-height: 1.2em;
  }
</style>
</head>
<body>

<header>
  <h1>Walter — Delivery</h1>
  <div style="display:flex;align-items:center">
    <div id="status-dot"></div>
    <span id="status-label">Connecting…</span>
  </div>
</header>

<div class="main">
  <div id="map-wrap">
    <canvas id="map-canvas"></canvas>
    <div id="robot-marker"></div>
  </div>

  <div id="sidebar">
    <h2>Select Table</h2>
    <div id="table-list">
      <p style="color:#64748b;font-size:0.85rem">Loading tables…</p>
    </div>
    <div id="robot-state"></div>
    <button id="send-btn" disabled>Send Walter</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
<script src="app.js"></script>
</body>
</html>
