controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]

    # --- YOUR CUSTOM ROOMBA PLANNER ---
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0      # MUST BE 0.0: Strictly forbids reversing!
      min_vel_y: 0.0      # MUST BE 0.0: No sideways sliding
      max_vel_x: 0.10     # Ultra-slow forward (10cm/s)
      max_vel_y: 0.0      # MUST BE 0.0: No sideways sliding
      max_vel_theta: 1.0  # Increased to 1.0 so he can actually pivot away from walls
      min_speed_xy: 0.0
      max_speed_xy: 0.10  # Matched to your max_vel_x
      min_speed_theta: 0.0
